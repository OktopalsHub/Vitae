[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "job-application"
version = "0.1.0"
description = "Job match dashboard with tailored CV generation"
requires-python = "==3.12.*"
dependencies = [
  "fastapi[standard]>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.12",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.0",
  "httpx>=0.27.2",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.2",
  "python-docx>=1.1.2",
  "fpdf2>=2.8.1",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "beautifulsoup4>=4.12.3",
  "lxml>=5.3.0",
  "openai>=1.54.0",
  "anthropic>=0.39.0",
  "google-genai>=1.0.0",
  "python-slugify>=8.0.4",
  "fastapi-users[sqlalchemy,oauth]>=14.0.0",
  "httpx-oauth>=0.15.0",
  "cryptography>=43.0.0",
  "email-validator>=2.2.0",
  "aiosqlite>=0.20.0",
  "pypdf>=5.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*", "templates/**/*", "static/*", "static/**/*"]

[tool.fastapi]
entrypoint = "app.main:app"
