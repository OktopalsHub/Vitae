{% extends "base.html" %}
{% block title %}Upload CV · Vitae{% endblock %}
{% block content %}
<div class="page-head">
  <p class="eyebrow">Onboarding</p>
  <h1>Upload your CV</h1>
  <p class="lede">PDF or DOCX required. We’ll extract your details for you to confirm in short steps.</p>
</div>

<div class="panel" style="max-width:32rem">
  {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/onboarding" enctype="multipart/form-data" class="form-grid" data-busy>
    <label style="grid-column:1/-1">Resume file
      <input type="file" name="file" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" required />
    </label>
    <div><button class="btn btn-primary" type="submit">Upload &amp; continue</button></div>
  </form>
</div>
{% endblock %}
